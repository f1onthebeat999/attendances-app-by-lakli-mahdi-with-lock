name: Build Windows installer

# Builds Setup.exe automatically in GitHub's cloud — no Windows PC needed.
# Runs on every push to main, and can also be triggered manually from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run dist:win

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Class-Attendance-Manager-Setup
          path: release/*.exe
